#scr:not(.d) h1{font-size:34px}.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mg .b2{margin:0;padding:10px}.panel b.hd{display:block;text-align:left;margin:12px 0 0;font-size:15px;color:#ffd23f}

#scr:not(.d){align-items:flex-end;background:linear-gradient(transparent 18%,#050818cc 70%);backdrop-filter:none;-webkit-backdrop-filter:none}
#scr:not(.d) .panel{background:linear-gradient(165deg,#222d78aa,#10164ccc 55%,#0a0e34dd) padding-box,linear-gradient(140deg,#fff0a0,#ffb300 35%,#ff7a18 65%,#ffe27a) border-box;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:400px}
#scr:not(.d) h1{font-size:40px;animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.9}to{opacity:1}}
.tip{font-size:12px;color:#cfe3ff;margin:10px 0 2px;transition:opacity .3s;min-height:16px;letter-spacing:.3px}
#scr:not(.d) .b{background-size:200% 100%;animation:shine 2.2s linear infinite}
@keyframes shine{0%,100%{opacity:1}50%{opacity:.86}}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:28px}
.fx i{position:absolute;bottom:-20px;font-style:normal;font-size:20px;opacity:.7;animation:fl 7s linear infinite}
.fx i:nth-child(1){left:8%}.fx i:nth-child(2){left:24%;animation-delay:1.2s}.fx i:nth-child(3){left:42%;animation-delay:2.4s}.fx i:nth-child(4){left:60%;animation-delay:.6s}.fx i:nth-child(5){left:78%;animation-delay:3.1s}.fx i:nth-child(6){left:90%;animation-delay:4.2s}
@keyframes fl{to{transform:translateY(-420px) rotate(40deg);opacity:0}}
.mg .mtb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:22px;text-align:center}.mtb small{font-size:10px;letter-spacing:.3px;font-weight:800}.mg .mtb.on{border-color:#ffd23f;background:linear-gradient(135deg,#ffd23f33,#ffffff0a);box-shadow:0 0 14px #ffd23f44}

/* ---------- ORDERS: premium orange / dark-blue mission selection ---------- */
#scr.sc-orp{background:radial-gradient(120% 55% at 92% 0%,rgba(255,122,24,.24),transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(41,90,255,.24),transparent 60%),linear-gradient(#0a1038f2,#050818f7)}
#pn.orp{padding:12px 12px 14px;border-radius:26px;background:linear-gradient(165deg,#1a2672f2,#0c1342f5 50%,#070b2af8) padding-box,linear-gradient(145deg,#ffc27a,#ff7a18 38%,#6b3512 70%,#ff9a3c) border-box;box-shadow:0 22px 60px #000c,0 0 44px rgba(255,122,24,.22),inset 0 1px 0 #ffffff26}
#pn.orp>*{animation:none}
.or{display:grid;gap:10px;text-align:left;color:#fff;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.or button{font:inherit;color:#fff}
.or-h{display:flex;align-items:center;gap:10px}
.or-hi{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:13px;font-size:20px;background:linear-gradient(#ffb04a,#ff7a1a 55%,#e05a00);box-shadow:0 3px 0 #9a3c00,0 6px 14px rgba(255,122,24,.4),inset 0 2px 0 rgba(255,255,255,.55)}
.or-ht{flex:1;min-width:0}.or-ht h2{margin:0;font-size:21px;line-height:1.05;font-weight:900;letter-spacing:.2px}
.or-ht p{margin:3px 0 0;font-size:11.5px;line-height:1.25;font-weight:600;opacity:.68}
.or-hm{flex:none;padding:5px 11px;border-radius:12px;font-size:12px;font-weight:800;color:#ffd9ae;background:rgba(255,122,24,.16);border:1px solid rgba(255,160,70,.4);font-variant-numeric:tabular-nums}
.or-s{display:flex;align-items:center;gap:8px;margin-bottom:-3px;font-size:12.5px;font-weight:800;color:#ffcf9a}
.or-s::before{content:"";width:4px;height:13px;border-radius:2px;background:linear-gradient(#ffb04a,#ff6a00)}
.or-s::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.22),transparent)}
/* delivery type tiles */
.or-tr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-top:4px}
.or-t,.or-a{position:relative;min-width:0;border:1px solid rgba(255,255,255,.14);background:linear-gradient(180deg,#2a3a8c,#18235e);box-shadow:0 4px 0 #080c2c,0 8px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.26);transition:transform .15s cubic-bezier(.2,1.3,.4,1),box-shadow .15s,filter .2s}
.or-t{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:7px 2px 6px;border-radius:14px}
.or-t::before{content:"";position:absolute;left:3px;right:3px;top:2px;height:42%;border-radius:11px 11px 40% 40%;background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,0));pointer-events:none}
.or-t .ti{display:grid;place-items:center;height:27px;font-size:23px;line-height:1}
.or-t small{display:block;max-width:100%;margin:0;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;font-weight:800;opacity:1}
.or-t .mx{font-style:normal;font-size:9.5px;font-weight:800;color:#ffcf8a}
.or-t:active:not([disabled]),.or-a:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 #080c2c,0 3px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.26)}
.or-t.on,.or-a.on{background:linear-gradient(180deg,#ffb04a,#ff7a1a 55%,#e05a00);border-color:rgba(255,230,190,.75);box-shadow:0 4px 0 #9a3c00,0 10px 20px rgba(255,122,24,.45),inset 0 2px 0 rgba(255,255,255,.55);transform:translateY(-2px);text-shadow:0 1px 0 #a04000}
.or-t.on .mx{color:#fff4dc}
.or-t.lk,.or-a.lk{border:1px dashed rgba(255,255,255,.17);background:linear-gradient(180deg,#1a2050,#10143a);box-shadow:0 3px 0 #070a24;color:#7b86b8}
.or-t.lk .ti{color:#8a94c4}.or-t.lk small{font-weight:700}
.lk-i{width:19px;height:19px;fill:rgba(255,255,255,.08);stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.or-ck{position:absolute;top:-6px;right:-4px;width:17px;height:17px;padding:3px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);fill:none;stroke:#e86300;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;animation:or-check .3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes or-check{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.or-t.fr,.or-a.fr{animation:or-pop .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes or-pop{0%{transform:translateY(3px) scale(.92)}60%{transform:translateY(-5px) scale(1.05)}100%{transform:translateY(-2px) scale(1)}}
/* unlock effect */
.or-t.nw,.or-a.nw{animation:or-unl .7s cubic-bezier(.2,1.4,.4,1) both,or-ring 1.1s ease-out .15s 3}
@keyframes or-unl{0%{transform:scale(.7);filter:brightness(2.2) saturate(.2)}60%{transform:scale(1.12);filter:brightness(1.4)}100%{transform:none;filter:none}}
@keyframes or-ring{0%{box-shadow:0 0 0 0 rgba(255,190,70,.9),0 4px 0 #080c2c}100%{box-shadow:0 0 0 16px rgba(255,190,70,0),0 4px 0 #080c2c}}
.or-nb{position:absolute;top:-8px;left:50%;padding:1px 7px;border-radius:9px;font-style:normal;font-size:9.5px;font-weight:900;color:#5a2a00;white-space:nowrap;text-shadow:none;background:linear-gradient(#fff0a0,#ffc233);box-shadow:0 2px 6px rgba(0,0,0,.4);transform:translateX(-50%);animation:or-nb 1.2s ease-in-out infinite alternate;z-index:2}
@keyframes or-nb{to{transform:translateX(-50%) translateY(-2px)}}
.nw u{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#ffe27a;box-shadow:0 0 6px #ffb300;opacity:0;pointer-events:none;text-decoration:none;animation:or-sp .9s ease-out .1s both}
@keyframes or-sp{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-34px) scale(.3)}}
/* info bars */
.or-i{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:-2px;padding:6px 8px 6px 10px;border-radius:12px;font-size:11.5px;font-weight:600;line-height:1.3;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.or-i span{min-width:0;opacity:.84}
.or-i em{flex:none;padding:2px 8px;border-radius:9px;font-style:normal;font-size:11.5px;font-weight:900;white-space:nowrap;background:linear-gradient(#ffb04a,#ff7a1a);box-shadow:0 2px 0 #9a3c00;text-shadow:0 1px 0 #a04000}
/* area cards */
.or-ar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:4px}
.or-a{display:block;padding:0;border-radius:15px;text-align:center}
.or-a .sc{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:50px;margin:3px 3px 0;padding:0 5px 12px;overflow:hidden;border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,var(--sky) 0 76%,var(--gr) 76%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.or-a .sc i{flex:1;max-width:12px;height:var(--h);border-radius:2px 2px 0 0;background:var(--b);box-shadow:inset -2px 0 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.3)}
.or-a .sc::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:5px;background:rgba(40,44,56,.92)}
.or-a b{display:block;padding:4px 3px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;font-weight:800}
.or-a .xm{position:absolute;top:6px;right:6px;padding:0 5px;border-radius:8px;font-style:normal;font-size:9px;font-weight:900;text-shadow:none;color:#ffcf8a;background:rgba(5,8,24,.74);border:1px solid rgba(255,255,255,.18)}
.or-a.lk .sc{filter:grayscale(.9) brightness(.42)}
.or-a>.lk-i{position:absolute;left:50%;top:28px;width:22px;height:22px;margin:-11px 0 0 -11px;color:#b6c0ee}
/* special order (evCard markup, restyled) */
.or-ev .cd{position:relative;margin:0;padding:8px;border-radius:16px;border:1px solid rgba(255,210,100,.6);background:linear-gradient(135deg,rgba(255,150,40,.3),rgba(255,210,63,.1) 60%,rgba(20,28,80,.4));box-shadow:0 4px 0 #6a3200,0 10px 22px rgba(255,122,24,.28),inset 0 1px 0 rgba(255,255,255,.35);animation:or-glow 2.4s ease-in-out infinite alternate}
@keyframes or-glow{to{box-shadow:0 4px 0 #6a3200,0 10px 26px rgba(255,150,40,.5),inset 0 1px 0 rgba(255,255,255,.35)}}
.or-ev .sw{width:40px;height:40px;border-radius:13px;background:linear-gradient(#ffb04a,#ff6a00)!important}
.or-ev .cd b{font-size:14px;line-height:1.2}.or-ev .cd small{margin-top:2px;font-size:11px;line-height:1.3;opacity:.82}
/* delivery cards */
.or-dl{display:grid;gap:7px}
.or-d{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 7px;border-radius:16px;background:linear-gradient(180deg,rgba(44,60,140,.72),rgba(16,22,66,.9));border:1px solid rgba(255,255,255,.14);box-shadow:0 3px 0 #080c2c,0 8px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.or-oi{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;font-size:21px;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.22),0 3px 8px rgba(0,0,0,.45)}
.or-od{flex:1;min-width:0}.or-od b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;line-height:1.15}
.or-rt{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:11px;font-weight:700;color:#b9c4f2;font-variant-numeric:tabular-nums}
.or-rt i{width:6px;height:6px;border-radius:50%;background:#ff9a3c;box-shadow:0 0 6px rgba(255,154,60,.8)}
.or-rt i:last-of-type{background:transparent;border:1.5px solid #fff;box-shadow:none}
.or-rt s{width:18px;border-top:2px dotted rgba(255,255,255,.4);text-decoration:none}
.or-rt em{margin-left:3px;font-style:normal;color:#fff}
.or-take,.or-ev .s.o{flex:none;min-width:62px;height:36px;margin:0;padding:0 14px;border:0;border-radius:12px;font-size:14px;font-weight:900;color:#fff;background:linear-gradient(#ffb04a,#ff7a1a 55%,#e86300);box-shadow:0 3px 0 #9a3c00,0 6px 12px rgba(255,122,24,.4),inset 0 1px 0 rgba(255,255,255,.55);text-shadow:0 1px 0 #a04000}
.or-take:active,.or-ev .s.o:active{transform:translateY(2px);box-shadow:0 1px 0 #9a3c00}
.or-back{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:42px;border:1px solid rgba(255,255,255,.16);border-radius:14px;font-size:14px;font-weight:800;color:#dfe6ff;background:linear-gradient(180deg,#2a3880,#18235e);box-shadow:0 4px 0 #080c2c,inset 0 1px 0 rgba(255,255,255,.25)}
.or-back svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.or-back:active{transform:translateY(3px);box-shadow:0 1px 0 #080c2c}
/* entrance (first open only) */
@keyframes or-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#pn.orp.in .or>*{animation:or-up .4s cubic-bezier(.2,.9,.3,1) both}
#pn.orp.in .or>:nth-child(2){animation-delay:.04s}#pn.orp.in .or>:nth-child(3){animation-delay:.08s}#pn.orp.in .or>:nth-child(4){animation-delay:.12s}#pn.orp.in .or>:nth-child(5){animation-delay:.16s}#pn.orp.in .or>:nth-child(6){animation-delay:.2s}#pn.orp.in .or>:nth-child(7){animation-delay:.24s}#pn.orp.in .or>:nth-child(8){animation-delay:.28s}#pn.orp.in .or>:nth-child(n+9){animation-delay:.32s}
@media (max-width:340px){.or-t small,.or-a b{font-size:9.5px}.or-ht p{display:none}.or-hm{padding:4px 8px}}
@media (prefers-reduced-motion:reduce){.or *,#pn.orp.in .or>*{animation:none!important}}

/* ---------- MISSION COMPLETE: navy / metallic gold / emerald ---------- */
#scr.sc-cmp{background:radial-gradient(110% 50% at 50% 0%,rgba(16,185,129,.24),transparent 62%),radial-gradient(90% 45% at 100% 100%,rgba(255,196,60,.14),transparent 60%),linear-gradient(#070d34f2,#04071cf8)}
#pn.cmp{padding:16px 12px 0;border-radius:26px;background:linear-gradient(165deg,#18236af2,#0b1240f5 52%,#060a28f8) padding-box,linear-gradient(135deg,#fff3b0,#e6b422 22%,#8a5a0a 45%,#ffe27a 62%,#b8860b 82%,#fff0a0) border-box;box-shadow:0 22px 60px #000c,0 0 44px rgba(52,211,153,.18),inset 0 1px 0 #ffffff26}
#pn.cmp.lose{background:linear-gradient(165deg,#161d58f2,#0a1038f5 52%,#060a26f8) padding-box,linear-gradient(135deg,#e8edf8,#8d97b8 25%,#4a5278 50%,#c4cbe0 70%,#7d86a8) border-box;box-shadow:0 22px 60px #000c,0 0 36px rgba(255,90,82,.14),inset 0 1px 0 #ffffff22}
#pn.cmp>*{animation:none}
.cm{position:relative;display:grid;gap:11px;text-align:center;color:#fff;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.cm-cf{position:absolute;left:0;right:0;top:-14px;height:230px;overflow:hidden;pointer-events:none}
.cm-cf i{position:absolute;top:-10px;left:var(--x);width:6px;height:10px;border-radius:2px;background:var(--c);opacity:0;animation:cm-fall 1.9s ease-in var(--d) 1 both}
@keyframes cm-fall{0%{opacity:1;transform:translateY(0) rotate(var(--r))}100%{opacity:0;transform:translateY(220px) rotate(calc(var(--r) + 300deg))}}
.cm-hd{position:relative;display:grid;justify-items:center;gap:6px}
.cm-em{position:relative;width:84px;height:92px;display:grid;place-items:center}
.cm-em::before{content:"";position:absolute;inset:-28px -34px;background:radial-gradient(closest-side,rgba(52,211,153,.5),rgba(255,210,90,.18) 55%,transparent 72%);animation:cm-glow 3s ease-in-out infinite alternate}
.cm-em::after{content:"";position:absolute;left:50%;top:44%;width:80px;height:80px;margin:-40px;border-radius:50%;border:3px solid rgba(94,240,168,.8);opacity:0;animation:cm-ring .9s ease-out .3s both}
.cm-em svg{position:relative;z-index:1;width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)) drop-shadow(0 0 12px rgba(255,200,60,.35));animation:cm-medal .75s cubic-bezier(.2,1.3,.4,1) both,cm-float 3.4s ease-in-out .9s infinite}
@keyframes cm-medal{0%{transform:scale(.3) rotate(-25deg);opacity:0}60%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes cm-float{50%{transform:translateY(-3px)}}
@keyframes cm-glow{to{opacity:.65;transform:scale(1.08)}}
@keyframes cm-ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.7)}}
.cm-t{margin:0;font-size:21px;line-height:1.15;font-weight:900;letter-spacing:.2px;background:linear-gradient(180deg,#fff7cf,#ffd45a 50%,#d89a16);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;opacity:0;animation:cm-up .5s cubic-bezier(.2,.9,.3,1) .15s both}
.cm-t.lose{background:linear-gradient(180deg,#ffffff,#c9d1ea 55%,#8f99bb);-webkit-background-clip:text;background-clip:text}
.cm-sub{margin:0;font-size:12.5px;font-weight:600;opacity:.7}
.cm-em.lose{width:76px;height:76px}.cm-em.lose::before{background:radial-gradient(closest-side,rgba(255,90,82,.35),transparent 70%)}.cm-em.lose::after{display:none}
.cm-lose{position:relative;z-index:1;width:70px;height:70px;display:grid;place-items:center;border-radius:50%;font-size:32px;background:radial-gradient(circle at 35% 28%,#3a4688,#141b52 70%);border:3px solid #aab3d2;box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.35),0 0 0 3px rgba(255,90,82,.25);animation:cm-shake .55s ease-out .1s both}
@keyframes cm-shake{0%{transform:scale(.4);opacity:0}50%{transform:scale(1.1) rotate(-6deg);opacity:1}70%{transform:rotate(5deg)}100%{transform:none}}
/* stars */
.cm-st{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:60px;margin-top:-2px}
.cm-star{width:42px;height:42px;opacity:0;animation:cm-star .55s cubic-bezier(.2,1.5,.4,1) calc(.38s + var(--i)*.22s) both}
.cm-star:nth-child(2){width:54px;height:54px;margin-bottom:6px}
.cm-star path{stroke-width:1.2;stroke-linejoin:round}
.cm-star.on path{fill:url(#cmg);stroke:#8a5a0a}.cm-star.on{filter:drop-shadow(0 3px 0 rgba(120,70,0,.6)) drop-shadow(0 0 9px rgba(255,200,60,.55))}
.cm-star.off path{fill:#1b2350;stroke:rgba(255,255,255,.18)}.cm-star.off{animation-name:cm-off}
@keyframes cm-star{0%{transform:scale(0) rotate(-60deg);opacity:0}60%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes cm-off{from{opacity:0;transform:scale(.7)}to{opacity:.55;transform:none}}
/* reward */
.cm-rw{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 14px;border-radius:18px;background:linear-gradient(180deg,rgba(255,206,80,.18),rgba(14,20,62,.86));border:1px solid rgba(255,214,90,.5);box-shadow:0 4px 0 #5a3a05,0 10px 24px rgba(255,190,60,.2),inset 0 1px 0 rgba(255,255,255,.3);opacity:0;animation:cm-up .5s cubic-bezier(.2,.9,.3,1) .62s both}
.cm-rw::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);animation:cm-sh 4.5s ease-in-out 1.6s infinite}
@keyframes cm-sh{0%,60%{left:-60%}100%{left:140%}}
.cm-coin{width:44px;height:44px;flex:none;filter:drop-shadow(0 2px 4px rgba(255,170,0,.55));animation:cm-bounce .6s cubic-bezier(.2,1.6,.4,1) .75s both}
@keyframes cm-bounce{0%{transform:scale(.4) rotate(-40deg)}100%{transform:none}}
.cm-rw small{display:block;font-size:11.5px;font-weight:700;opacity:.7;text-align:left}
.cm-rw b{display:block;font-size:34px;line-height:1.05;font-weight:900;text-align:left;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff7cf,#ffd45a 48%,#d89a16 52%,#ffe27a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
/* stat cards */
.cm-g{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.cm-g.two{grid-template-columns:repeat(2,1fr)}
.cm-c{padding:8px 4px 7px;border-radius:14px;background:linear-gradient(180deg,rgba(38,54,128,.7),rgba(14,20,62,.9));border:1px solid rgba(255,255,255,.13);box-shadow:0 3px 0 #070a24,inset 0 1px 0 rgba(255,255,255,.2)}
.cm-c small{display:block;font-size:10.5px;font-weight:700;opacity:.65}
.cm-c b{display:block;margin-top:2px;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.cm-c.em{border-color:rgba(60,220,140,.45);background:linear-gradient(180deg,rgba(22,130,84,.5),rgba(8,40,40,.88))}.cm-c.em b{color:#7bffc0}.cm-c.gd b{color:#ffd45a}
.cm-x{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cm-r{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;padding:6px 10px;border-radius:12px;font-size:11.5px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.cm-r span{flex:none;opacity:.72;white-space:nowrap}.cm-r b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;text-align:right}
.cm-r.w{grid-column:1/-1}.cm-r.em b{color:#7bffc0}.cm-r.gd b{color:#ffd45a}
.cm-g>*,.cm-x>*{opacity:0;animation:cm-up .4s cubic-bezier(.2,.9,.3,1) calc(.85s + var(--i)*.06s) both}
/* level up */
.lu{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:18px;text-align:left;border:1px solid rgba(255,214,90,.55);background:linear-gradient(135deg,rgba(255,200,60,.22),rgba(22,140,90,.24) 55%,rgba(10,16,52,.88));box-shadow:0 4px 0 #5a3a05,0 10px 24px rgba(255,190,60,.25),inset 0 1px 0 rgba(255,255,255,.3);opacity:0;animation:cm-lu .6s cubic-bezier(.2,1.2,.3,1) var(--d,1.15s) both}
@keyframes cm-lu{0%{opacity:0;transform:translateY(14px) scale(.92)}100%{opacity:1;transform:none}}

.lu-b::before{content:"";position:absolute;inset:-18px;background:repeating-conic-gradient(rgba(255,226,122,.5) 0 8deg,transparent 8deg 24deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);animation:cm-spin 14s linear infinite}
@keyframes cm-spin{to{transform:rotate(360deg)}}
.lu-b svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.lu-b span{position:absolute;font-size:20px;font-weight:900;color:#ffe27a;text-shadow:0 2px 0 #5a3a05;font-variant-numeric:tabular-nums}
.lu-b u{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#ffe27a;box-shadow:0 0 6px #ffb300;opacity:0;text-decoration:none;animation:cm-sp .9s ease-out calc(var(--d,1.15s) + .2s) both}
@keyframes cm-sp{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(-40px) scale(.3)}}
.lu-t{flex:1;min-width:0}.lu-t b{display:block;font-size:15px;font-weight:900;color:#ffe27a}.lu-t small{display:block;margin-top:1px;font-size:11.5px;font-weight:600;opacity:.75}
.lu-r{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.lu-r i{padding:2px 8px;border-radius:9px;font-style:normal;font-size:11px;font-weight:800;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.lu-r i.un{color:#4a2a00;background:linear-gradient(#fff0a0,#ffc233);border-color:#fff4b8}
.lu-r i.up{color:#7bffc0;background:rgba(22,140,90,.35);border-color:rgba(60,220,140,.5)}
/* actions */
.cm-act{position:sticky;bottom:0;z-index:3;display:grid;gap:7px;margin:0 -12px;padding:12px 12px 14px;background:linear-gradient(rgba(6,10,40,0),#060a28 38%);opacity:0;animation:cm-up .4s cubic-bezier(.2,.9,.3,1) .5s both}
.cm-b,.cm-b2{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;font:inherit;color:#fff;border-radius:15px}
.cm-b{height:48px;font-size:16px;font-weight:900;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.cm-b.em{background:linear-gradient(#4ee0a0,#12a96a 55%,#0b8a55);box-shadow:0 4px 0 #065a38,0 8px 18px rgba(16,185,129,.4),inset 0 1px 0 rgba(255,255,255,.55)}
.cm-b.gd{color:#4a2a00;text-shadow:0 1px 0 rgba(255,255,255,.4);background:linear-gradient(#fff0a0,#f2c230 50%,#d89a16);box-shadow:0 4px 0 #8a5a0a,0 8px 18px rgba(255,190,60,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.cm-b2{height:40px;font-size:14px;font-weight:800;color:#dfe6ff;border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,#2a3880,#18235e);box-shadow:0 3px 0 #080c2c,inset 0 1px 0 rgba(255,255,255,.25)}
.cm-b:active{transform:translateY(3px);box-shadow:0 1px 0 #065a38}.cm-b.gd:active{box-shadow:0 1px 0 #8a5a0a}.cm-b2:active{transform:translateY(2px);box-shadow:0 1px 0 #080c2c}
@keyframes cm-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:340px){.cm-t{font-size:19px}.cm-rw b{font-size:30px}.cm-c b{font-size:15px}}
@media (prefers-reduced-motion:reduce){.cm *,.cm-em::before,.cm-em::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}

/* ---------- PREMIUM LOADING SCREEN ---------- */

font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;transition:opacity .6s ease,transform .6s ease,visibility .6s}
#ld.out{opacity:0;visibility:hidden;transform:scale(1.05);pointer-events:none}
#ld::before{content:"";position:absolute;inset:0;opacity:.7;background:
radial-gradient(1.5px 1.5px at 12% 14%,#fff,transparent),radial-gradient(1px 1px at 28% 30%,#cfe0ff,transparent),radial-gradient(1.5px 1.5px at 44% 9%,#fff,transparent),

background:linear-gradient(#ffd23f,#ff7a18 52%,#ff2d6f);box-shadow:0 0 70px rgba(255,120,30,.45);
-webkit-mask:linear-gradient(#000 0 52%,transparent 52% 55%,#000 55% 65%,transparent 65% 69%,#000 69% 79%,transparent 79% 84%,#000 84%);mask:linear-gradient(#000 0 52%,transparent 52% 55%,#000 55% 65%,transparent 65% 69%,#000 69% 79%,transparent 79% 84%,#000 84%)}
#ld .rd{position:absolute;left:50%;bottom:0;width:130%;height:40%;overflow:hidden;transform:translateX(-50%) perspective(240px) rotateX(55deg);transform-origin:50% 100%;background:linear-gradient(#0d1338,#1a2160);border-top:2px solid rgba(94,231,255,.7);box-shadow:0 -6px 30px rgba(94,231,255,.35)}

box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 44px rgba(255,157,46,.4),inset 0 1px 0 rgba(255,255,255,.3);animation:ld-fl 2.4s ease-in-out infinite}
#ld .k{font-size:12px;font-weight:800;letter-spacing:.55em;padding-left:.55em;color:#9fb4ff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
